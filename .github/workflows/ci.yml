name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR supersedes the run still going; it tests
# everything the older one would have.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

jobs:
  # Each job runs only when something it checks has changed, so an OpenSpec archive commit
  # does not spin up Testcontainers and a client tweak does not rebuild the backend. A job
  # skipped here still counts as passing for required checks. Editing this file runs all.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      specs: ${{ steps.filter.outputs.specs }}
      backend: ${{ steps.filter.outputs.backend }}
      client: ${{ steps.filter.outputs.client }}
      conformance: ${{ steps.filter.outputs.conformance }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            specs:
              - 'openspec/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'src/**'
              - 'conformance/**'
              - 'global.json'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'gaudiballz.slnx'
              - '.editorconfig'
              - '.github/workflows/ci.yml'
            client:
              - 'client/**'
              - 'conformance/**'
              - 'CHANGELOG.md'
              - '.github/workflows/ci.yml'
            conformance:
              - 'src/GaudiBallz.Rules/**'
              - 'src/GaudiBallz.Rules.Tests/**'
              - 'client/src/engine/**'
              - 'client/package-lock.json'
              - 'conformance/**'
              - 'global.json'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - '.github/workflows/ci.yml'

  specs:
    name: Specs
    needs: changes
    if: needs.changes.outputs.specs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install OpenSpec
        run: npm install -g @fission-ai/openspec@1.9.0
      # Strict mode: every requirement needs SHALL or MUST, at least one scenario, and
      # every capability a Purpose of 50+ characters. Only main specs are validated here;
      # in-progress changes get validated at archive time.
      - name: Validate specs
        run: openspec validate --specs --strict --no-interactive

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      # Docker is available on ubuntu-latest, so the Testcontainers-backed suites run
      # here too. The kernel and architecture suites have no container dependency.
      #
      # Test projects run on Microsoft Testing Platform: each is a self-hosting executable
      # rather than a library a VSTest host loads.
      - run: dotnet test --no-build --configuration Release

  client:
    name: Client
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  # The gate that matters most. Both engines run against the same committed fixtures in
  # conformance/v1/, and this job blocks merges on either side. Its failure mode is a
  # player solving a puzzle and being told they did not.
  conformance:
    name: Cross-language conformance
    needs: changes
    if: needs.changes.outputs.conformance == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      # --filter-trait, not --filter: MTP silently ignores the VSTest-style flag, which
      # would run the whole suite while looking like a targeted gate.
      #
      # Both halves read committed files, so the order does not matter: the C# side checks
      # the TypeScript engine's recorded answers, and the client side checks the fixtures
      # generated from C#. Neither regenerates here — a behaviour change shows up as a
      # failure rather than a quietly rewritten fixture.
      - run: dotnet test src/GaudiBallz.Rules.Tests -- --filter-trait "Category=Conformance"
      - run: npm ci
        working-directory: client
      - run: npm run test:conformance
        working-directory: client
